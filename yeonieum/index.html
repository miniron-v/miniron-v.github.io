<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes, viewport-fit=cover">
  <title>연이음 (Yeonieum) - 오늘의 단어 연결 퍼즐</title>
  <meta name="description" content="연이음(Yeonieum)은 매일 새로 나오는 단어 카드를 이어 하루 한 번 푸는 웹 퍼즐 게임입니다. 2026 넥슨 대학생 게임잼 '재밌넥' 출품작.">
  <link rel="canonical" href="https://miniron-v.github.io/yeonieum/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="연이음 (Yeonieum)">
  <meta property="og:description" content="매일 새로 나오는 단어 연결 퍼즐. 브라우저에서 바로 플레이하세요.">
  <meta property="og:url" content="https://miniron-v.github.io/yeonieum/">
  <meta property="og:image" content="https://miniron-v.github.io/assets/logo.png">
  <meta name="theme-color" content="#E1EFFF">
  <meta name="google-adsense-account" content="ca-pub-8936569039879498">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8936569039879498" crossorigin="anonymous"></script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "VideoGame",
    "name": "연이음 (Yeonieum)",
    "alternateName": "Yeonieum",
    "url": "https://miniron-v.github.io/yeonieum/",
    "image": "https://miniron-v.github.io/assets/logo.png",
    "description": "매일 새로 나오는 단어 카드를 이어 푸는 하루 한 번 웹 퍼즐 게임.",
    "genre": ["Puzzle", "Word game"],
    "gamePlatform": "Web browser",
    "playMode": "SinglePlayer",
    "inLanguage": ["ko", "en", "ja"],
    "isAccessibleForFree": true
  }
  </script>
  <style>
    /*
     * 레이아웃
     * - 기본(모바일·세로·좁은 화면): 맨 위 배너 띠 + 간격 + 나머지 전부 게임
     * - 넓은 가로 화면(폭 1000px·높이 680px 이상): 좌우 세로 배너(160x600) + 가운데 게임, 위쪽 띠 없음
     *   (높이가 모자라면 세로 배너가 잘리므로 위쪽 띠 방식을 쓴다)
     * 배너는 항상 캔버스 바깥에 있고, 게임 위로 겹치지 않는다.
     * Unity(matchWebGLToCanvasSize)가 캔버스 크기에 맞춰 렌더 해상도를 자동으로 맞춘다.
     */
    :root {
      --page-bg: #E1EFFF;   /* 게임 배경색과 같게 */
      --top-h: 50px;     /* 320x50 */
      --top-gap: 12px;   /* 배너와 게임 상단 버튼 사이 간격 */
      --rail-w: 160px;   /* 160x600 */
      --rail-gap: 24px;
    }
    @media (min-width: 728px) {
      :root { --top-h: 90px; } /* 728x90 */
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--page-bg);
    }

    #layout {
      position: fixed;
      inset: 0;
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: var(--top-h) 1fr;
      row-gap: var(--top-gap);
      padding-top: env(safe-area-inset-top, 0px);
      box-sizing: border-box;
    }

    .ad-slot {
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    #ad-top { grid-row: 1; grid-column: 1; }
    .ad-rail { display: none; }

    #game {
      position: relative;
      grid-row: 2;
      grid-column: 1;
      min-width: 0;
      min-height: 0;
      background: var(--page-bg);
    }

    /* 넓은 가로 화면: 좌우 레일 */
    @media (min-width: 1000px) and (min-height: 680px) and (orientation: landscape) {
      #layout {
        grid-template-columns: var(--rail-w) 1fr var(--rail-w);
        grid-template-rows: 1fr;
        column-gap: var(--rail-gap);
        row-gap: 0;
        padding: 0 var(--rail-gap);
      }
      #ad-top { display: none; }
      .ad-rail { display: flex; align-items: flex-start; padding-top: 24px; grid-row: 1; }
      #ad-left { grid-column: 1; }
      #game { grid-column: 2; grid-row: 1; }
      #ad-right { grid-column: 3; }
    }

    #unity-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      background: var(--page-bg);
      outline: none;
      touch-action: none;          /* 모바일에서 스크롤/핀치줌 대신 게임 입력으로 */
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    #unity-loading {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: min(320px, 60%);
      pointer-events: none;
    }

    #unity-progress-bar {
      height: 6px;
      border-radius: 3px;
      background: rgba(59, 130, 246, 0.18);
      overflow: hidden;
    }

    #unity-progress-bar-full {
      width: 0%;
      height: 100%;
      border-radius: 3px;
      background: #3b82f6;
      transition: width 0.15s ease-out;
    }

    #unity-warning {
      position: absolute;
      left: 50%;
      top: 8px;
      transform: translateX(-50%);
      max-width: calc(100% - 16px);
      font: 14px/1.4 sans-serif;
      display: none;
      z-index: 10;
    }

    #unity-warning > div {
      padding: 8px 12px;
      margin-bottom: 4px;
      border-radius: 4px;
    }

    noscript p {
      position: absolute;
      inset: auto 16px 50% 16px;
      color: #1f2a3a;
      font: 16px/1.5 sans-serif;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="layout">
    <aside id="ad-top" class="ad-slot" data-ad-kind="top" aria-label="광고"></aside>
    <aside id="ad-left" class="ad-slot ad-rail" data-ad-kind="rail" aria-label="광고"></aside>
    <main id="game">
      <canvas id="unity-canvas" tabindex="-1" role="img"
        aria-label="연이음(Yeonieum) 게임 화면. 단어 카드를 이어 오늘의 퍼즐을 푸는 게임입니다."></canvas>
      <div id="unity-loading">
        <div id="unity-progress-bar"><div id="unity-progress-bar-full"></div></div>
      </div>
      <div id="unity-warning"></div>
      <noscript><p>연이음(Yeonieum)은 브라우저에서 실행되는 단어 연결 퍼즐 게임입니다. 플레이하려면 자바스크립트를 켜 주세요. <a href="/">게임 소개 보기</a></p></noscript>
    </main>
    <aside id="ad-right" class="ad-slot ad-rail" data-ad-kind="rail" aria-label="광고"></aside>
  </div>

  <script>
    // ---------------------------------------------------------------
    // 광고 설정: 애드센스 승인 후 게시자 ID와 광고 단위 ID를 채운다.
    // 비어 있으면 광고 자리만 비워 두고 아무것도 불러오지 않는다.
    // ---------------------------------------------------------------
    var ADSENSE_CLIENT = "ca-pub-8936569039879498";
    var AD_SLOT_TOP = "";             // 위쪽 띠 배너 광고 단위 ID (320x50 / 728x90)
    var AD_SLOT_RAIL = "";            // 좌우 세로 배너 광고 단위 ID (160x600)

    (function setupAds() {
      if (!ADSENSE_CLIENT) return;
      var filled = {};

      function sizeFor(kind) {
        if (kind === "rail") return [160, 600];
        return window.innerWidth >= 728 ? [728, 90] : [320, 50];
      }

      function fillVisibleSlots() {
        var slots = document.querySelectorAll(".ad-slot");
        for (var i = 0; i < slots.length; i++) {
          var el = slots[i];
          if (filled[el.id] || el.offsetWidth === 0) continue; // 지금 레이아웃에서 숨겨진 자리는 요청하지 않음
          var kind = el.getAttribute("data-ad-kind");
          var slotId = kind === "rail" ? AD_SLOT_RAIL : AD_SLOT_TOP;
          if (!slotId) continue;
          var size = sizeFor(kind);
          var ins = document.createElement("ins");
          ins.className = "adsbygoogle";
          ins.style.display = "inline-block";
          ins.style.width = size[0] + "px";
          ins.style.height = size[1] + "px";
          ins.setAttribute("data-ad-client", ADSENSE_CLIENT);
          ins.setAttribute("data-ad-slot", slotId);
          el.appendChild(ins);
          filled[el.id] = true;
          try { (window.adsbygoogle = window.adsbygoogle || []).push({}); } catch (e) {}
        }
      }

      window.addEventListener("load", fillVisibleSlots);
      // 화면 회전 등으로 레이아웃이 바뀌면 새로 보이게 된 자리를 채운다.
      var wide = window.matchMedia("(min-width: 1000px) and (min-height: 680px) and (orientation: landscape)");
      if (wide.addEventListener) wide.addEventListener("change", fillVisibleSlots);
    })();

    // ---------------------------------------------------------------
    // Unity 로더
    // ---------------------------------------------------------------
    var canvas = document.querySelector("#unity-canvas");
    var loading = document.querySelector("#unity-loading");
    var progressFull = document.querySelector("#unity-progress-bar-full");
    var warningBanner = document.querySelector("#unity-warning");

    // Unity 가 에러/경고를 표시할 때 사용하는 배너. type: 'error' | 'warning' | 'info'
    function unityShowBanner(msg, type) {
      function updateBannerVisibility() {
        warningBanner.style.display = warningBanner.children.length ? "block" : "none";
      }
      var div = document.createElement("div");
      div.textContent = msg;
      if (type == "error") div.style.background = "#ff4d4d";
      else {
        if (type == "warning") div.style.background = "#ffd24d";
        else div.style.background = "#ffffff";
        setTimeout(function () {
          warningBanner.removeChild(div);
          updateBannerVisibility();
        }, 5000);
      }
      warningBanner.appendChild(div);
      updateBannerVisibility();
    }

    // 빌드를 교체할 때 BUILD_ID를 바꾸면 방문자 브라우저 캐시를 우회한다.
    var PRODUCT_VERSION = "1.0.0";
    var BUILD_ID = "20261114b";
    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/yeonieum.loader.js?v=" + BUILD_ID;
    var config = {
      arguments: [],
      dataUrl: buildUrl + "/yeonieum.data.unityweb?v=" + BUILD_ID,
      frameworkUrl: buildUrl + "/yeonieum.framework.js.unityweb?v=" + BUILD_ID,
      codeUrl: buildUrl + "/yeonieum.wasm.unityweb?v=" + BUILD_ID,
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Yeonieum",
      productName: "Yeonieum",
      productVersion: PRODUCT_VERSION,
      showBanner: unityShowBanner,
      matchWebGLToCanvasSize: true,
    };

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        progressFull.style.width = 100 * progress + "%";
      }).then(function (unityInstance) {
        loading.style.display = "none";
        window.unityInstance = unityInstance;
        canvas.focus();
      }).catch(function (message) {
        unityShowBanner(String(message), "error");
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
